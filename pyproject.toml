[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medsignal-noshow"
version = "0.1.0"
description = "A synthetic appointment-level classification exercise using lead time, prior no-shows, reminders, chronic-condition foll"
requires-python = ">=3.9"
dependencies = ["numpy==2.0.2", "scikit-learn==1.6.1"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
